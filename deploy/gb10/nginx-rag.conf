# /etc/nginx/conf.d/rag.conf に置く。実測はしていない（GB10 の実機で動かしたことがない）。
# 外へ開けるのは 443 だけ。3つの経路を1つのホスト名にまとめる。
#   /      -> rag_web（127.0.0.1:8502）  Basic 認証
#   /llm/  -> 生成の vLLM（127.0.0.1:8001）  認証は vLLM の --api-key（Bearer）
#   /mcp   -> 社内資料の MCP（127.0.0.1:8080）  Bearer トークンを Nginx で確かめる
#
# 秘密はこのファイルに書かない。リポジトリの外のファイルを読み込む。
#   /etc/nginx/rag/htpasswd              ... htpasswd -c で作る（/ の Basic 認証）
#   /etc/nginx/rag/mcp-token.conf        ... 下の「MCP のトークン」の形で作る（権限 640、所有者 root:www-data）
#   /etc/nginx/rag/tls.conf              ... ssl_certificate / ssl_certificate_key の2行（内部CAの証明書）

# rag_web へ送るアップロードの大きさの上限。式は ceil(MB * 1,048,576 * 4 / 3) + 1,048,576 バイト
# （base64 で 1.34 倍になる分と JSON の枠）。RAG_WEB_MAX_UPLOAD_MB=50（既定）なら 70,953,643。
# RAG_WEB_MAX_UPLOAD_MB を変えたら、ここも計算し直す。rag_web は本文を全部読んでから
# 413 を返すため、ここで切るのが本当の上限になる。
# （/llm/ と /mcp は小さい要求しか来ないので、下で個別に小さくする。）

server {
    listen 443 ssl;
    server_name _;   # GB10 のホスト名に書き換える
    include /etc/nginx/rag/tls.conf;

    client_max_body_size 70953643;

    # --- /: rag_web --------------------------------------------------------
    location / {
        auth_basic "RAG";
        auth_basic_user_file /etc/nginx/rag/htpasswd;

        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # rag_web はログインの試行回数制限を、信頼した接続元からの X-Forwarded-For で数える。
        # これが無いと、全利用者がプロキシの IP 1つ分の枠を共有してしまう。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # チャットは NDJSON を逐次返す。溜め込むと最後にまとめて届く。
        proxy_buffering off;
        gzip off;
        # 生成が長くても切れないようにする。
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
    }

    # --- /llm/: 生成の vLLM（Claude Code の /v1/messages もここ）--------------
    # Claude Code は Basic 認証のヘッダーを送れないため、Nginx では認証しない。
    # vLLM の --api-key（Authorization: Bearer）が認証になる。
    location /llm/ {
        client_max_body_size 16m;

        # 末尾の / で /llm/ を外し、/llm/v1/messages を /v1/messages にして渡す。
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE のストリームを溜め込まない。
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
    }

    # --- /mcp: 社内資料の MCP ---------------------------------------------------
    location /mcp {
        client_max_body_size 1m;

        # トークンの確認。mcp-token.conf の中身は次の形（リポジトリの外に置く）。
        #   if ($http_authorization != "Bearer <MCP のトークン>") { return 401; }
        include /etc/nginx/rag/mcp-token.conf;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # MCP SDK の Host 検証（DNS リバインディング保護）は、127.0.0.1 に bind したときの
        # 既定では localhost 系の Host だけを通す見込み。外向きのホスト名のまま渡すと
        # 421 で断られるおそれがあるため、内側へは 127.0.0.1 で渡す。
        # 実測はしていない。421 が出たら docs/mcp-server-network.md の手順で確かめる。
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # streamable-http は SSE で返すことがある。
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
    }
}

# 80 番は開けない。必要なら 443 への転送だけにする。
#
# Nginx を Docker で動かす場合: rag_web から見える接続元は 127.0.0.1 ではなく
# Docker のブリッジの IP（例: 172.17.0.1）になる。rag_web 側の
# RAG_WEB_FORWARDED_ALLOW_IPS を、実際にプロキシが接続してくる IP（docker network inspect
# bridge で確かめる）にすること。127.0.0.1 のままだと X-Forwarded-For が信頼されず、
# 全利用者がログイン試行制限の同じ枠を共有する。"*" は rag_web が起動時に拒否する。
# Docker の Nginx から 127.0.0.1 の各ポートへは届かないため、その場合は
# --network host にするか、proxy_pass の宛先をホストの IP に変える。
